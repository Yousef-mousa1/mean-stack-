<header class="fixed top-0 left-0 right-0 z-50 bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-16 gap-4">

      <!-- Logo -->
      <a routerLink="/" class="text-xl font-bold text-emerald-600 shrink-0">
        Mousa Shop
      </a>

      <!-- Search Input -->
      <div class="hidden md:flex flex-1 max-w-xl">
        <input
          type="text"
          placeholder="Search..."
          class="w-full border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-gray-50/50"
        />
      </div>


      <!-- Cart & Auth Action Buttons -->
      <div class="flex items-center gap-3">

        <!-- Cart Icon -->
        <a routerLink="/cart" class="relative p-2 text-gray-700 hover:text-emerald-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.5 5M17 21a1 1 0 100-2 1 1 0 000 2zM9 21a1 1 0 100-2 1 1 0 000 2z" />
          </svg>
          @if (cartCount > 0) {
            <span class="absolute top-0 right-0 bg-emerald-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">
              {{ cartCount }}
            </span>
          }
        </a>

        <!-- Login Button -->
        <a
          routerLink="/login"
          class="hidden md:inline-flex items-center justify-center px-4 py-1.5 text-sm font-semibold text-emerald-600 border border-emerald-500 rounded-lg hover:bg-emerald-600 hover:text-white transition-all duration-300"
        >
          Login
        </a>

        <!-- Register Button -->
        <a
          routerLink="/register"
          class="hidden md:inline-flex items-center justify-center px-4 py-1.5 text-sm font-semibold text-emerald-600 border border-emerald-500 rounded-lg hover:bg-emerald-600 hover:text-white transition-all duration-300"
        >
          Register
        </a>

        <!-- Mobile Menu Toggle Button -->
        <button class="md:hidden text-gray-700 p-2" (click)="toggleMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

    </div>

    <!-- Mobile Dropdown Menu -->
    @if (isMenuOpen) {
      <div class="md:hidden pb-4 pt-2 flex flex-col gap-3 text-sm font-medium border-t border-gray-100 bg-white">
        <input
          type="text"
          placeholder="Search..."
          class="w-full border border-gray-300 rounded-full px-4 py-2 text-sm my-1"
        />
        <a routerLink="/products" class="px-2 py-1 hover:text-emerald-600"></a>
        <a routerLink="/wishlist" class="px-2 py-1 hover:text-emerald-600"></a>
        <div class="flex gap-2 pt-2">
          <a routerLink="/login" class="flex-1 text-center py-2 text-sm font-semibold text-emerald-600 border border-emerald-500 rounded-lg hover:bg-emerald-600 hover:text-white transition-all">Login</a>
          <a routerLink="/register" class="flex-1 text-center py-2 text-sm font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 transition-all">Register</a>
        </div>
      </div>
    }
  </div>
</header>
