<section class="max-w-md mx-auto mt-24 p-6 bg-white rounded-xl shadow-sm">
  <h2 class="text-2xl font-bold mb-2 text-center">تأكيد الإيميل</h2>
  <p class="text-gray-500 text-sm text-center mb-6">
    بعتنالك كود مكوّن من 6 أرقام على إيميلك، اكتبه هنا.
  </p>

  @if (errorMessage) {
    <div class="mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm text-center">
      {{ errorMessage }}
    </div>
  }

  <form [formGroup]="otpForm" (ngSubmit)="verify()" class="space-y-4">
    <input
      type="text"
      formControlName="otp"
      maxlength="6"
      placeholder="------"
      class="w-full text-center tracking-[0.5em] text-xl border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500"
    />

    <button
      type="submit"
      [disabled]="otpForm.invalid || loading"
      class="w-full py-3 rounded-lg text-white font-semibold bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 disabled:cursor-not-allowed"
    >
      {{ loading ? 'بيتأكد...' : 'تأكيد' }}
    </button>
  </form>

  <p class="text-center text-sm text-gray-500 mt-4">
    غلطت في التسجيل؟ <a routerLink="/register" class="text-emerald-600 font-semibold">ارجع سجّل تاني</a>
  </p>
</section>
