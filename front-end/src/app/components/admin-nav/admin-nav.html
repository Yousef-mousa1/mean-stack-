<header class="fixed top-0 left-0 right-0 z-50 bg-slate-800 text-white">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex items-center justify-between h-14">

      <div class="flex items-center gap-6">
        <span class="font-bold text-lg text-emerald-400">Mousa Shop — Admin</span>

        <nav class="hidden md:flex items-center gap-1 text-sm">
          <a
            routerLink="/admin-dashboard"
            routerLinkActive="bg-slate-700"
            class="px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors"
          >
            Users
          </a>
          <a
            routerLink="/admin/categories"
            routerLinkActive="bg-slate-700"
            class="px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors"
          >
            Categories
          </a>
          <a
            routerLink="/admin/products"
            routerLinkActive="bg-slate-700"
            class="px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors"
          >
            Products
          </a>
          <a
            routerLink="/admin/orders"
            routerLinkActive="bg-slate-700"
            class="px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors"
          >
            Orders
          </a>
          <a
            routerLink="/admin/coupons"
            routerLinkActive="bg-slate-700"
            class="px-3 py-2 rounded-lg hover:bg-slate-700 transition-colors"
          >
            Coupons
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-3 text-sm">
        <a routerLink="/" class="text-gray-300 hover:text-white transition-colors">
          الرجوع للموقع
        </a>
        <span class="text-gray-300">
          Hello, {{ auth.currentUser()?.name }}
        </span>
        <button
          (click)="logout()"
          class="px-3 py-1.5 rounded-lg text-red-300 border border-red-400 hover:bg-red-500 hover:text-white transition-colors"
        >
          Logout
        </button>
      </div>

    </div>
  </div>
</header>
