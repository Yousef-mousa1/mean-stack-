<div class="cart-container">
  <h2>Shopping Cart</h2>

  <div *ngIf="loading">Loading cart...</div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="cart && cart.items && cart.items.length > 0; else emptyCart">
    <table class="cart-table">
      <thead>
        <tr>
          <th>Product ID</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of cart.items">
          <td>{{ item.productId }}</td>
          <td>{{ item.quantity }}</td>
        </tr>
      </tbody>
    </table>

    <div>
      <button class="checkout-btn">
        Proceed to Checkout
      </button>
    </div>
  </div>

  <ng-template #emptyCart>
    <p class="empty-cart" *ngIf="!loading">Your cart is empty.</p>
  </ng-template>
</div>
